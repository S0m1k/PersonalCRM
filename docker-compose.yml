# Вся система одной командой:  docker compose up -d --build   → http://localhost:3300
# Перед первым запуском:        python scripts/init_env.py   (создаст backend/.env с секретами)
#
# Порты открыты только на 127.0.0.1 — снаружи этого компьютера CRM недоступна.

services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: personalcrm

  # Счётчики рейт-лимитов (и очередь задач ИИ). Данные не нужны после перезапуска — без тома.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  # Вложения к контактам (S3). Наружу не открыт: к файлам ходит только backend.
  # Логин/пароль — в backend/minio.env (создаёт scripts/init_env.py); его же читает backend.
  # Официальные образы MinIO больше не публикуются — community-сборка того же сервера.
  # Bucket создаёт backend при старте.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data"]
    env_file:
      - ./backend/minio.env
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    # По умолчанию — только этот компьютер. Для телефона в домашней сети (CardDAV):
    # BACKEND_BIND=0.0.0.0 в файле .env рядом с этим файлом, см. docs/setup_phone.md
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      - mongo
      - redis
      - minio
    env_file:
      - ./backend/.env
      - ./backend/minio.env
    environment:
      # Внутри docker-сети база доступна по имени сервиса — перекрывает значение из .env
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000

  # Очередь задач ИИ (arq): тот же образ backend, другая команда. Один экземпляр —
  # AI_CONCURRENCY ограничивает одновременные запросы к модели. Модель — LLM_BASE_URL в backend/.env
  ai-worker:
    build: ./backend
    restart: unless-stopped
    command: ["arq", "app.ai.worker.WorkerSettings"]
    depends_on:
      - mongo
      - redis
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    # Снаружи 3300, а не 3000: 3000 часто занят другими dev-серверами
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local
