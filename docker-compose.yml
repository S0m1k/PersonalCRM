version: "3.9"

services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # Для локальной разработки без аутентификации — в продакшне добавить MONGO_INITDB_ROOT_USERNAME/PASSWORD
    environment:
      MONGO_INITDB_DATABASE: personalcrm

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      # Имя сервиса "mongo" резолвится внутри docker network
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: personalcrm
      SECRET_KEY: change-me-in-production
    # Для разработки: монтируем код, чтобы изменения применялись без пересборки
    # volumes:
    #   - ./backend:/app

volumes:
  mongo_data:
    driver: local
